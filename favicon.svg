<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Casque de bomber">
  <rect width="32" height="32" rx="6" fill="#120f1c" />
  <!-- The aerial and its bead. Kept from the bomb that was here before: it is
       the one shape that still reads at 16 pixels, and it is a bomber's too. -->
  <path d="M15 4h2v6h-2z" fill="#9aa4bd" />
  <circle cx="16" cy="4" r="2.2" fill="#ffd45e" />
  <!-- The helmet alone, and it therefore fills the frame: with the bust gone
       there is nothing to leave room for underneath, and a head drawn small in
       the middle of its square is what makes an icon look timid.
       The lighter band along the top is what keeps the dome from reading as a
       flat disc once the icon is down to sixteen pixels. -->
  <path d="M4 21a12 12 0 0 1 24 0v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#2fa84f" />
  <path d="M4 21a12 12 0 0 1 24 0v1H4z" fill="#6fd98a" />
  <circle cx="3.6" cy="21.5" r="2.6" fill="#e8edf5" />
  <circle cx="28.4" cy="21.5" r="2.6" fill="#e8edf5" />
  <!-- The visor, and the two eyes in it. Two white marks on a dark band is the
       whole face: at favicon size nothing finer survives. -->
  <rect x="7.5" y="15.5" width="17" height="9" rx="4" fill="#15152a" />
  <rect x="11" y="17.5" width="4" height="5" rx="1.6" fill="#f6f9ff" />
  <rect x="17" y="17.5" width="4" height="5" rx="1.6" fill="#f6f9ff" />
</svg>
